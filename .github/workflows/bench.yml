name: benchmarks

on:
  push:
    branches: [main]
    paths:
      - "programs/**"
      - "measure.py"
  schedule:
    - cron: "0 4 1 * *"
  workflow_dispatch:

permissions:
  contents: write

env:
  RASMALAI_REPO: ${{ vars.RASMALAI_REPO || 'renhiyama/Rasmalai' }}
  RASMALAI_REF: ${{ vars.RASMALAI_REF || 'main' }}

jobs:
  bench:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          path: rnxbenchmarks

      - name: Install C toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc g++

      - uses: actions-rust-lang/rustup@v1
        with:
          toolchain: stable

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Check out the Rasmalai compiler
        uses: actions/checkout@v4
        with:
          repository: ${{ env.RASMALAI_REPO }}
          ref: ${{ env.RASMALAI_REF }}
          path: Rasmalai

      - name: Build rnx
        working-directory: Rasmalai/compiler
        run: cargo build --locked -p cli

      - name: Run benchmarks
        working-directory: rnxbenchmarks
        env:
          RNX_BIN: ${{ github.workspace }}/Rasmalai/compiler/target/debug/rnx
        run: python3 measure.py

      - name: Commit updated results
        working-directory: rnxbenchmarks
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add results.json RESULTS.md
          git diff --cached --quiet || git commit -m "bench: refresh results ($(date -u +%Y-%m-%d))"
          git push
